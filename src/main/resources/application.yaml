spring:
  application:
    name: spazacred-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spazacred_db}
    username: ${DB_USERNAME:spazacred_user}
    password: ${DB_PASSWORD:spazacred_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    web:
      pageable:
        max-page-size: 100

server:
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 12

credit:
  overdue-grace-days: ${SPAZACRED_CREDIT_OVERDUE_GRACE_DAYS:7}
  overdue-job-cron: "0 0 1 * * *"
  overdue-job-zone: Africa/Johannesburg

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
