spring:
  application:
    name: spazacred-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spazacred_db}
    username: ${DB_USERNAME:spazacred_user}
    password: ${DB_PASSWORD:spazacred_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:9l7w9c8d2e1b4n6f9d7c6e8a1b5f6d9c2e4a7b8c1d3f5e6a9b2c4b7q8f1b3c6}
  expiration-hours: 12

credit:
  overdue-grace-days: 7
  overdue-job-cron: "0 0 1 * * *"
  overdue-job-zone: Africa/Johannesburg

data:
  web:
    pageable:
      max-page-size: 100