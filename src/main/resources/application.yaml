spring:
  application:
    name: spazacred-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    web:
      pageable:
        max-page-size: 100

server:
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 12

credit:
  overdue-grace-days: 7
  overdue-job-cron: "0 0 1 * * *"
  overdue-job-zone: Africa/Johannesburg

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
